<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G検定 学習ツール</title>
<style>
:root {
  --primary: #4f46e5;
  --primary-dark: #3730a3;
  --primary-light: #eef2ff;
  --primary-glow: rgba(79, 70, 229, 0.15);
  --accent: #7c3aed;
  --correct: #059669;
  --correct-light: #d1fae5;
  --wrong: #dc2626;
  --wrong-light: #fee2e2;
  --bg: #f0f2f8;
  --card: #ffffff;
  --text: #1e293b;
  --text-sub: #64748b;
  --border: #e2e8f0;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.07), 0 2px 4px rgba(0,0,0,0.04);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.08), 0 4px 8px rgba(0,0,0,0.04);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  min-height: 100vh;
  background-image: radial-gradient(circle at 20% 20%, rgba(79,70,229,0.04) 0%, transparent 50%),
                    radial-gradient(circle at 80% 80%, rgba(124,58,237,0.04) 0%, transparent 50%);
}

.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 20px;
}

/* Header */
header {
  text-align: center;
  padding: 36px 0 24px;
  position: relative;
}

header h1 {
  font-size: 2rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--primary), var(--accent), #ec4899);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.02em;
}

header p {
  color: var(--text-sub);
  margin-top: 8px;
  font-size: 0.9rem;
  letter-spacing: 0.03em;
}

/* Stats bar */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}

.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
  box-shadow: var(--shadow-sm);
  transition: transform var(--transition), box-shadow var(--transition);
  position: relative;
  overflow: hidden;
}

.stat-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  border-radius: var(--radius) var(--radius) 0 0;
}

.stat-correct::before { background: linear-gradient(90deg, var(--correct), #34d399); }
.stat-wrong::before { background: linear-gradient(90deg, var(--wrong), #f87171); }
.stat-pass::before { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
.stat-rate::before { background: linear-gradient(90deg, var(--primary), var(--accent)); }

.stat-card .stat-value {
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.stat-card .stat-label {
  font-size: 0.72rem;
  color: var(--text-sub);
  margin-top: 2px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
}

.stat-correct .stat-value { color: var(--correct); }
.stat-wrong .stat-value { color: var(--wrong); }
.stat-rate .stat-value { color: var(--primary); }

/* Category filter */
.category-section {
  margin-bottom: 20px;
}

.category-section label {
  display: block;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--text-sub);
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.category-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  padding: 8px 16px;
  border-radius: 24px;
  border: 1.5px solid var(--border);
  background: var(--card);
  font-size: 0.82rem;
  cursor: pointer;
  transition: all var(--transition);
  user-select: none;
  box-shadow: var(--shadow-sm);
  font-weight: 500;
}

.chip:hover {
  border-color: var(--primary);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.chip.active {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  border-color: transparent;
  box-shadow: 0 2px 8px var(--primary-glow);
}

/* Question card */
.question-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-md);
  transition: box-shadow var(--transition);
}

.question-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.question-category {
  font-size: 0.76rem;
  font-weight: 700;
  color: var(--primary);
  background: var(--primary-light);
  padding: 4px 12px;
  border-radius: 20px;
  letter-spacing: 0.02em;
}

.question-number {
  font-size: 0.8rem;
  color: var(--text-sub);
  font-weight: 600;
}

.question-text {
  font-size: 1.05rem;
  font-weight: 600;
  margin-bottom: 24px;
  line-height: 1.85;
}

/* Options */
.options { display: flex; flex-direction: column; gap: 10px; }

.option-btn {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 16px 20px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  background: var(--card);
  cursor: pointer;
  transition: all var(--transition);
  text-align: left;
  font-size: 0.95rem;
  line-height: 1.65;
  box-shadow: var(--shadow-sm);
}

.option-btn:hover:not(.disabled) {
  border-color: var(--primary);
  background: var(--primary-light);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.option-btn:active:not(.disabled) {
  transform: translateY(0);
}

.option-btn .option-label {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2px solid var(--border);
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--text-sub);
  flex-shrink: 0;
  transition: all var(--transition);
}

.option-btn.selected {
  border-color: var(--primary);
  background: var(--primary-light);
  box-shadow: 0 2px 8px var(--primary-glow);
}

.option-btn.selected .option-label {
  border-color: var(--primary);
  background: var(--primary);
  color: white;
}

.option-btn.correct {
  border-color: var(--correct);
  background: var(--correct-light);
  box-shadow: 0 2px 8px rgba(5,150,105,0.15);
}

.option-btn.correct .option-label {
  border-color: var(--correct);
  background: var(--correct);
  color: white;
}

.option-btn.wrong {
  border-color: var(--wrong);
  background: var(--wrong-light);
  box-shadow: 0 2px 8px rgba(220,38,38,0.15);
}

.option-btn.wrong .option-label {
  border-color: var(--wrong);
  background: var(--wrong);
  color: white;
}

.option-btn.disabled { cursor: default; }

/* Explanation */
.explanation {
  margin-top: 24px;
  padding: 24px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, #f8faff, #f1f5f9);
  border-left: 4px solid var(--primary);
  display: none;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.04);
}

.explanation.show {
  display: block;
  animation: fadeSlideIn 0.3s ease-out;
}

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

.explanation h4 {
  font-size: 0.88rem;
  color: var(--primary);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.explanation h4::before {
  content: '💡';
  font-size: 0.9rem;
}

.explanation p {
  font-size: 0.9rem;
  line-height: 1.85;
  color: var(--text);
}

.result-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 16px;
  border-radius: 20px;
  font-size: 0.82rem;
  font-weight: 700;
  margin-bottom: 12px;
}

.result-badge.correct-badge {
  background: var(--correct-light);
  color: var(--correct);
}

.result-badge.wrong-badge {
  background: var(--wrong-light);
  color: var(--wrong);
}

/* Buttons */
.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 20px;
  justify-content: center;
  flex-wrap: wrap;
}

.btn {
  padding: 13px 32px;
  border: none;
  border-radius: var(--radius);
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--transition);
  letter-spacing: 0.01em;
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  box-shadow: 0 3px 12px var(--primary-glow);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px var(--primary-glow);
}

.btn-primary:active {
  transform: translateY(0);
}

.btn-outline {
  background: var(--card);
  border: 1.5px solid var(--border);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}

.btn-outline:hover {
  border-color: var(--primary);
  color: var(--primary);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

/* Progress bar */
.progress-section {
  margin-bottom: 20px;
  background: var(--card);
  padding: 16px 20px;
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}

.progress-bar-bg {
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--accent), #ec4899);
  background-size: 200% 100%;
  border-radius: 4px;
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  animation: shimmer 2s ease-in-out infinite;
}

@keyframes shimmer {
  0%, 100% { background-position: 0% 0%; }
  50% { background-position: 100% 0%; }
}

.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 0.78rem;
  color: var(--text-sub);
  margin-bottom: 8px;
  font-weight: 600;
}

/* Start screen */
.start-screen {
  text-align: center;
  padding: 48px 24px;
}

.start-screen h2 {
  font-size: 1.4rem;
  margin-bottom: 8px;
  font-weight: 800;
}

.start-screen p {
  color: var(--text-sub);
  margin-bottom: 28px;
}

.mode-cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}

.mode-card {
  padding: 20px 16px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  background: var(--card);
  cursor: pointer;
  transition: all var(--transition);
  box-shadow: var(--shadow-sm);
}

.mode-card:hover {
  border-color: var(--primary);
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.mode-card.active {
  border-color: var(--primary);
  background: var(--primary-light);
  box-shadow: 0 3px 12px var(--primary-glow);
}

.mode-card h3 {
  font-size: 1.1rem;
  margin-bottom: 4px;
  font-weight: 800;
}

.mode-card p { font-size: 0.78rem; color: var(--text-sub); }

/* Seen badge */
.seen-stats {
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: center;
  margin-bottom: 20px;
  padding: 14px 18px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 0.85rem;
  color: var(--text-sub);
  box-shadow: var(--shadow-sm);
}

.seen-stats .seen-count {
  font-weight: 700;
  color: var(--primary);
}

.seen-stats .unseen-count {
  font-weight: 700;
  color: #f59e0b;
}

.chip .chip-badge {
  display: inline-block;
  font-size: 0.68rem;
  margin-left: 4px;
  padding: 1px 6px;
  border-radius: 10px;
  background: var(--border);
  color: var(--text-sub);
  font-weight: 700;
  vertical-align: middle;
}

.chip.active .chip-badge {
  background: rgba(255,255,255,0.3);
  color: white;
}

.filter-row {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.filter-btn {
  padding: 8px 16px;
  border-radius: 24px;
  border: 1.5px solid var(--border);
  background: var(--card);
  font-size: 0.82rem;
  cursor: pointer;
  transition: all var(--transition);
  user-select: none;
  box-shadow: var(--shadow-sm);
  font-weight: 500;
}

.filter-btn:hover {
  border-color: var(--primary);
  transform: translateY(-1px);
}

.filter-btn.active {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  border-color: transparent;
  box-shadow: 0 2px 8px var(--primary-glow);
}

.filter-btn.active[id="filterUnseen"] {
  background: linear-gradient(135deg, #f59e0b, #fbbf24);
  box-shadow: 0 2px 8px rgba(245,158,11,0.25);
}

.filter-btn.active[id="filterWrong"] {
  background: linear-gradient(135deg, var(--wrong), #f87171);
  box-shadow: 0 2px 8px rgba(220,38,38,0.25);
}

.filter-btn.active[id="filterPassed"] {
  background: linear-gradient(135deg, #f59e0b, #fbbf24);
  box-shadow: 0 2px 8px rgba(245,158,11,0.25);
}

.question-seen-badge {
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
  margin-left: 8px;
}

.question-seen-badge.new {
  background: #fef3c7;
  color: #d97706;
}

.question-seen-badge.seen {
  background: #e2e8f0;
  color: #64748b;
}

/* Pass button */
.pass-btn {
  display: block;
  margin: 16px auto 0;
  padding: 10px 28px;
  border: 1.5px dashed var(--border);
  border-radius: var(--radius);
  background: transparent;
  color: var(--text-sub);
  font-size: 0.85rem;
  cursor: pointer;
  transition: all var(--transition);
}

.pass-btn:hover {
  border-color: #f59e0b;
  color: #f59e0b;
  background: #fffbeb;
  transform: translateY(-1px);
}

.pass-btn .pass-key {
  font-size: 0.72rem;
  margin-left: 6px;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--border);
  color: var(--text-sub);
}

.stat-pass .stat-value { color: #f59e0b; }

.result-badge.pass-badge {
  background: #fef3c7;
  color: #d97706;
}

/* Exam countdown */
.exam-countdown {
  display: none;
  text-align: center;
  margin-bottom: 16px;
  padding: 10px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
}

.exam-countdown.show { display: block; }

.exam-countdown .countdown-label {
  font-size: 0.72rem;
  color: var(--text-sub);
  font-weight: 600;
  letter-spacing: 0.03em;
}

.exam-countdown .countdown-days {
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--primary);
  line-height: 1.4;
}

.exam-countdown .countdown-date {
  font-size: 0.7rem;
  color: var(--text-sub);
  margin-top: 2px;
}

.exam-countdown .countdown-edit {
  font-size: 0.68rem;
  color: var(--text-sub);
  background: none;
  border: none;
  cursor: pointer;
  text-decoration: underline;
  margin-top: 2px;
}

.exam-countdown .countdown-edit:hover { color: var(--primary); }

.exam-countdown.past .countdown-days {
  color: var(--correct);
}

.set-exam-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 14px;
  margin-bottom: 16px;
  border: 1px dashed var(--border);
  border-radius: 20px;
  background: var(--card);
  color: var(--text-sub);
  font-size: 0.75rem;
  cursor: pointer;
  transition: all var(--transition);
}

.set-exam-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
  border-style: solid;
}

/* Quit button */
.quit-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 8px 16px;
  margin-bottom: 16px;
  border: 1.5px solid var(--border);
  border-radius: 24px;
  background: var(--card);
  color: var(--text-sub);
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  box-shadow: var(--shadow-sm);
}

.quit-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.clear-history-btn {
  font-size: 0.75rem;
  color: var(--text-sub);
  background: none;
  border: none;
  cursor: pointer;
  text-decoration: underline;
  margin-top: 12px;
  transition: color var(--transition);
}

.clear-history-btn:hover { color: var(--wrong); }

/* Footer */
footer {
  text-align: center;
  padding: 24px 16px;
  font-size: 0.75rem;
  color: var(--text-sub);
  border-top: 1px solid var(--border);
  margin-top: 12px;
}

/* ================================ */
/* Responsive — Tablet              */
/* ================================ */
@media (max-width: 768px) {
  .mode-cards {
    grid-template-columns: repeat(2, 1fr);
  }
  .stats-bar {
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
}

/* ================================ */
/* Responsive — Mobile              */
/* ================================ */
@media (max-width: 600px) {
  body {
    -webkit-text-size-adjust: 100%;
  }

  .container {
    padding: 12px;
  }

  header {
    padding: 24px 0 16px;
  }

  header h1 {
    font-size: 1.5rem;
  }

  header p {
    font-size: 0.82rem;
  }

  /* Stats — 2x2 grid on mobile */
  .stats-bar {
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .stat-card {
    padding: 12px 8px;
  }

  .stat-card .stat-value {
    font-size: 1.3rem;
  }

  .stat-card .stat-label {
    font-size: 0.68rem;
  }

  /* Progress */
  .progress-section {
    padding: 12px 14px;
    border-radius: var(--radius-sm);
  }

  /* Question card */
  .question-card {
    padding: 20px 16px;
    border-radius: var(--radius-sm);
  }

  .question-text {
    font-size: 0.98rem;
    line-height: 1.8;
    margin-bottom: 18px;
  }

  .question-meta {
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 8px;
  }

  /* Options — larger tap targets */
  .options {
    gap: 8px;
  }

  .option-btn {
    padding: 14px 14px;
    gap: 10px;
    font-size: 0.9rem;
    border-radius: var(--radius-sm);
    min-height: 48px;
  }

  .option-btn .option-label {
    min-width: 28px;
    height: 28px;
    font-size: 0.78rem;
  }

  .option-btn:hover:not(.disabled) {
    transform: none;
  }

  /* Mode cards */
  .mode-cards {
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .mode-card {
    padding: 16px 12px;
    min-width: unset;
    border-radius: var(--radius-sm);
  }

  .mode-card h3 {
    font-size: 1rem;
  }

  /* Start screen */
  .start-screen {
    padding: 32px 16px;
  }

  .start-screen h2 {
    font-size: 1.2rem;
  }

  /* Category chips — scrollable row */
  .category-chips {
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 4px;
    margin: 0 -4px;
    padding-left: 4px;
    padding-right: 4px;
  }

  .category-chips::-webkit-scrollbar {
    display: none;
  }

  .chip {
    flex-shrink: 0;
    padding: 8px 14px;
    font-size: 0.78rem;
  }

  .chip:hover {
    transform: none;
  }

  /* Filter row — scrollable */
  .filter-row {
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    justify-content: flex-start;
    padding-bottom: 4px;
  }

  .filter-row::-webkit-scrollbar {
    display: none;
  }

  .filter-btn {
    flex-shrink: 0;
    padding: 8px 14px;
    font-size: 0.78rem;
    min-height: 36px;
  }

  .filter-btn:hover {
    transform: none;
  }

  /* Buttons — full width on mobile */
  .btn-row {
    flex-direction: column;
    gap: 8px;
  }

  .btn {
    width: 100%;
    padding: 14px 24px;
    font-size: 0.95rem;
    min-height: 48px;
  }

  .btn-primary:hover,
  .btn-outline:hover {
    transform: none;
  }

// ============================================================
// App State
// ============================================================
// Generate a stable ID for each question based on content
function questionId(q) {
  return (q.category + '::' + q.question).substring(0, 120);
}

let state = {
  mode: 10,
  selectedCategories: [],
  questionFilter: 'all', // 'all' | 'unseen' | 'seen'
  currentQuestions: [],
  currentIndex: 0,
  correct: 0,
  wrong: 0,
  passed: 0,
  answered: false,
  wrongQuestions: [],
  passedQuestions: [],
  history: JSON.parse(localStorage.getItem('gkentei_history') || '{}'),
  seenQuestions: JSON.parse(localStorage.getItem('gkentei_seen') || '{}')
};

// ============================================================
// Init
// ============================================================
const categories = [...new Set(questions.map(q => q.category))];

function init() {
  loadExamDate();
  updateCategoryChips();
  updateSeenStats();
  setQuestionFilter('all');
}

function updateCategoryChips() {
  const chips = document.getElementById('categoryChips');
  chips.innerHTML = categories.map(c => {
    const total = questions.filter(q => q.category === c).length;
    const seen = questions.filter(q => q.category === c && state.seenQuestions[questionId(q)]).length;
    const isActive = state.selectedCategories.includes(c);
    return `<div class="chip${isActive ? ' active' : ''}" onclick="toggleCategory(this, '${c}')">${c} <span class="chip-badge">${seen}/${total}</span></div>`;
  }).join('');
}

function updateSeenStats() {
  const totalQ = questions.length;
  const seenQ = questions.filter(q => state.seenQuestions[questionId(q)]).length;
  const unseenQ = totalQ - seenQ;
  const wrongQ = questions.filter(q => { const s = state.seenQuestions[questionId(q)]; return s && s.wrong > 0; }).length;
  const passedQ = questions.filter(q => { const s = state.seenQuestions[questionId(q)]; return s && s.passed > 0; }).length;
  const pct = Math.round((seenQ / totalQ) * 100);
  document.getElementById('seenStats').innerHTML =
    `全 <strong>${totalQ}</strong> 問中 ` +
    `<span class="seen-count">${seenQ}問 回答済み</span> / ` +
    `<span class="unseen-count">${unseenQ}問 未回答</span>` +
    (wrongQ > 0 ? ` / <span style="font-weight:700;color:var(--wrong);">${wrongQ}問 要復習</span>` : '') +
    (passedQ > 0 ? ` / <span style="font-weight:700;color:#f59e0b;">${passedQ}問 パス</span>` : '') +
    ` (進捗 ${pct}%)`;
}

function setQuestionFilter(filter) {
  state.questionFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById('filter' + filter.charAt(0).toUpperCase() + filter.slice(1)).classList.add('active');
}

function toggleCategory(el, cat) {
  el.classList.toggle('active');
  if (state.selectedCategories.includes(cat)) {
    state.selectedCategories = state.selectedCategories.filter(c => c !== cat);
  } else {
    state.selectedCategories.push(cat);
  }
}

function selectMode(el) {
  document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  state.mode = parseInt(el.dataset.count);
}

// ============================================================
// Quiz Logic
// ============================================================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  let pool = questions;
  if (state.selectedCategories.length > 0) {
    pool = questions.filter(q => state.selectedCategories.includes(q.category));
  }
  // Apply seen/unseen/wrong filter
  if (state.questionFilter === 'unseen') {
    pool = pool.filter(q => !state.seenQuestions[questionId(q)]);
  } else if (state.questionFilter === 'seen') {
    pool = pool.filter(q => state.seenQuestions[questionId(q)]);
  } else if (state.questionFilter === 'wrong') {
    pool = pool.filter(q => {
      const s = state.seenQuestions[questionId(q)];
      return s && s.wrong > 0;
    });
  } else if (state.questionFilter === 'passed') {
    pool = pool.filter(q => {
      const s = state.seenQuestions[questionId(q)];
      return s && s.passed > 0;
    });
  }
  if (pool.length === 0) {
    const msgs = {
      unseen: '未回答の問題がありません。すべて回答済みです!',
      seen: '回答済みの問題がありません。まず問題を解いてみましょう!',
      wrong: '間違えた問題がありません。素晴らしい!',
      passed: 'パスした問題がありません!'
    };
    alert(msgs[state.questionFilter] || '該当する問題がありません。');
    return;
  }
  pool = shuffle(pool);
  const count = state.mode === 0 ? pool.length : Math.min(state.mode, pool.length);
  state.currentQuestions = pool.slice(0, count);
  state.currentIndex = 0;
  state.correct = 0;
  state.wrong = 0;
  state.passed = 0;
  state.wrongQuestions = [];
  state.passedQuestions = [];
  state.answered = false;

  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'block';
  document.getElementById('resultScreen').style.display = 'none';

  renderQuestion();
}

function startWithQuestions(qs) {
  state.currentQuestions = shuffle(qs);
  state.currentIndex = 0;
  state.correct = 0;
  state.wrong = 0;
  state.passed = 0;
  state.wrongQuestions = [];
  state.passedQuestions = [];
  state.answered = false;

  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'block';
  document.getElementById('resultScreen').style.display = 'none';

  renderQuestion();
}

function renderQuestion() {
  const q = state.currentQuestions[state.currentIndex];
  const total = state.currentQuestions.length;
  const idx = state.currentIndex;

  document.getElementById('qCategory').textContent = q.category;
  document.getElementById('qNumber').textContent = `Q${idx + 1} / ${total}`;
  document.getElementById('qText').textContent = q.question;

  const isSeen = state.seenQuestions[questionId(q)];
  document.getElementById('qSeenBadge').innerHTML = isSeen
    ? '<span class="question-seen-badge seen">回答済み</span>'
    : '<span class="question-seen-badge new">初めて</span>';

  const optionsArea = document.getElementById('optionsArea');
  const labels = ['A', 'B', 'C', 'D'];
  optionsArea.innerHTML = q.options.map((opt, i) =>
    `<button class="option-btn" onclick="selectAnswer(${i})">
      <span class="option-label">${labels[i]}</span>
      <span>${opt}</span>
    </button>`
  ).join('');

  document.getElementById('explanation').classList.remove('show');
  document.getElementById('btnRow').style.display = 'none';
  document.getElementById('passBtn').style.display = 'block';
  state.answered = false;

  // Update progress
  const pct = Math.round((idx / total) * 100);
  document.getElementById('progressText').textContent = `${idx + 1} / ${total}`;
  document.getElementById('progressPct').textContent = `${pct}%`;
  document.getElementById('progressBar').style.width = `${pct}%`;

  updateStats();
}

function selectAnswer(idx) {
  if (state.answered) return;
  state.answered = true;

  const q = state.currentQuestions[state.currentIndex];
  const btns = document.querySelectorAll('.option-btn');
  const isCorrect = idx === q.answer;

  btns.forEach((btn, i) => {
    btn.classList.add('disabled');
    if (i === q.answer) btn.classList.add('correct');
    if (i === idx && !isCorrect) btn.classList.add('wrong');
    if (i === idx) btn.classList.add('selected');
  });

  if (isCorrect) {
    state.correct++;
  } else {
    state.wrong++;
    state.wrongQuestions.push(q);
  }

  // Mark question as seen
  const qid = questionId(q);
  if (!state.seenQuestions[qid]) {
    state.seenQuestions[qid] = { firstSeen: Date.now(), correct: 0, wrong: 0, passed: 0 };
  }
  if (!state.seenQuestions[qid].passed) state.seenQuestions[qid].passed = 0;
  state.seenQuestions[qid][isCorrect ? 'correct' : 'wrong']++;
  state.seenQuestions[qid].lastSeen = Date.now();
  localStorage.setItem('gkentei_seen', JSON.stringify(state.seenQuestions));

  // Update category history
  if (!state.history[q.category]) {
    state.history[q.category] = { correct: 0, wrong: 0 };
  }
  state.history[q.category][isCorrect ? 'correct' : 'wrong']++;
  localStorage.setItem('gkentei_history', JSON.stringify(state.history));

  const badge = document.getElementById('resultBadge');
  badge.innerHTML = isCorrect
    ? '<span class="result-badge correct-badge">正解!</span>'
    : '<span class="result-badge wrong-badge">不正解</span>';

  document.getElementById('explanationText').textContent = q.explanation;
  document.getElementById('explanation').classList.add('show');
  document.getElementById('btnRow').style.display = 'flex';
  document.getElementById('passBtn').style.display = 'none';

  const isLast = state.currentIndex >= state.currentQuestions.length - 1;
  document.getElementById('nextBtn').textContent = isLast ? '結果を見る' : '次の問題';

  updateStats();
}

function passQuestion() {
  if (state.answered) return;
  state.answered = true;
  state.passed++;

  const q = state.currentQuestions[state.currentIndex];
  state.passedQuestions.push(q);

  // Mark as seen with pass
  const qid = questionId(q);
  if (!state.seenQuestions[qid]) {
    state.seenQuestions[qid] = { firstSeen: Date.now(), correct: 0, wrong: 0, passed: 0 };
  }
  if (!state.seenQuestions[qid].passed) state.seenQuestions[qid].passed = 0;
  state.seenQuestions[qid].passed++;
  state.seenQuestions[qid].lastSeen = Date.now();
  localStorage.setItem('gkentei_seen', JSON.stringify(state.seenQuestions));

  // Show correct answer and explanation
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach((btn, i) => {
    btn.classList.add('disabled');
    if (i === q.answer) btn.classList.add('correct');
  });

  const badge = document.getElementById('resultBadge');
  badge.innerHTML = '<span class="result-badge pass-badge">パス</span>';

  document.getElementById('explanationText').textContent = q.explanation;
  document.getElementById('explanation').classList.add('show');
  document.getElementById('btnRow').style.display = 'flex';
  document.getElementById('passBtn').style.display = 'none';

  const isLast = state.currentIndex >= state.currentQuestions.length - 1;
  document.getElementById('nextBtn').textContent = isLast ? '結果を見る' : '次の問題';

  updateStats();
}

function nextQuestion() {
  state.currentIndex++;
  if (state.currentIndex >= state.currentQuestions.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

function updateStats() {
  document.getElementById('correctCount').textContent = state.correct;
  document.getElementById('wrongCount').textContent = state.wrong;
  document.getElementById('passCount').textContent = state.passed;
  const total = state.correct + state.wrong + state.passed;
  document.getElementById('rateValue').textContent = total > 0
    ? Math.round((state.correct / total) * 100) + '%'
    : '-';
}

function showResult() {
  document.getElementById('quizScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';

  const total = state.correct + state.wrong + state.passed;
  const rate = total > 0 ? Math.round((state.correct / total) * 100) : 0;

  document.getElementById('finalCorrect').textContent = state.correct;
  document.getElementById('finalWrong').textContent = state.wrong;
  document.getElementById('finalPass').textContent = state.passed;
  document.getElementById('finalRate').textContent = rate + '%';

  const msg = document.getElementById('resultMessage');
  if (rate >= 90) {
    msg.textContent = '素晴らしい! 合格レベルです!';
    msg.style.color = 'var(--correct)';
  } else if (rate >= 70) {
    msg.textContent = 'いい調子です。もう少し頑張りましょう!';
    msg.style.color = 'var(--primary)';
  } else {
    msg.textContent = '復習が必要です。苦手分野を集中的に学習しましょう。';
    msg.style.color = 'var(--wrong)';
  }

  // Category breakdown
  const catStats = {};
  const wrongSet = new Set(state.wrongQuestions.map(q => q.question));
  const passedSet = new Set(state.passedQuestions.map(q => q.question));
  state.currentQuestions.forEach(q => {
    if (!catStats[q.category]) catStats[q.category] = { correct: 0, wrong: 0, passed: 0 };
    if (passedSet.has(q.question)) {
      catStats[q.category].passed++;
    } else if (wrongSet.has(q.question)) {
      catStats[q.category].wrong++;
    } else {
      catStats[q.category].correct++;
    }
  });

  let breakdownHTML = '<h3 style="font-size:0.95rem;margin-bottom:12px;">カテゴリ別結果</h3>';
  breakdownHTML += '<div style="display:flex;flex-direction:column;gap:8px;">';
  for (const [cat, s] of Object.entries(catStats)) {
    const catTotal = s.correct + s.wrong + s.passed;
    const catRate = catTotal > 0 ? Math.round((s.correct / catTotal) * 100) : 0;
    const barColor = catRate >= 70 ? 'var(--correct)' : catRate >= 50 ? '#f59e0b' : 'var(--wrong)';
    breakdownHTML += `
      <div>
        <div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:4px;">
          <span>${cat}</span>
          <span style="font-weight:600;">${s.correct}/${catAnswered}${s.passed > 0 ? ` <span style="color:#f59e0b;">+${s.passed}パス</span>` : ''} (${catRate}%)</span>
        </div>
        <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden;">
          <div style="height:100%;width:${catRate}%;background:${barColor};border-radius:3px;"></div>
        </div>
      </div>`;
  }
  breakdownHTML += '</div>';
  document.getElementById('categoryBreakdown').innerHTML = breakdownHTML;
}

function reviewWrong() {
  if (state.wrongQuestions.length === 0) {
    alert('間違えた問題はありません!');
    return;
  }
  startWithQuestions(state.wrongQuestions);
}

function reviewPassed() {
  if (state.passedQuestions.length === 0) {
    alert('パスした問題はありません!');
    return;
  }
  startWithQuestions(state.passedQuestions);
}

// ============================================================
// Exam Countdown
// ============================================================
function loadExamDate() {
  const saved = localStorage.getItem('gkentei_exam_date');
  if (saved) {
    updateCountdown(saved);
  } else {
    document.getElementById('setExamArea').style.display = 'block';
    document.getElementById('examCountdown').classList.remove('show');
  }
}

function promptExamDate() {
  const current = localStorage.getItem('gkentei_exam_date') || '';
  const input = prompt('試験日を入力してください（例: 2025-07-12）', current);
  if (!input) return;
  const parsed = new Date(input);
  if (isNaN(parsed.getTime())) {
    alert('日付の形式が正しくありません。\nYYYY-MM-DD の形式で入力してください。');
    return;
  }
  const dateStr = parsed.toISOString().split('T')[0];
  localStorage.setItem('gkentei_exam_date', dateStr);
  updateCountdown(dateStr);
}

function updateCountdown(dateStr) {
  const examDate = new Date(dateStr + 'T00:00:00');
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diffTime = examDate.getTime() - today.getTime();
  const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

  const el = document.getElementById('examCountdown');
  const setArea = document.getElementById('setExamArea');

  const year = examDate.getFullYear();
  const month = examDate.getMonth() + 1;
  const day = examDate.getDate();
  const formatted = `${year}年${month}月${day}日`;

  if (diffDays > 0) {
    el.className = 'exam-countdown show';
    el.innerHTML = `
      <div class="countdown-label">試験日まで</div>
      <div class="countdown-days">あと ${diffDays} 日</div>
      <div class="countdown-date">${formatted} ｜ <button class="countdown-edit" onclick="promptExamDate()">変更</button><button class="countdown-edit" onclick="clearExamDate()" style="margin-left:4px;">削除</button></div>
    `;
  } else if (diffDays === 0) {
    el.className = 'exam-countdown show';
    el.innerHTML = `
      <div class="countdown-label">${formatted}</div>
      <div class="countdown-days">今日が試験日！</div>
      <div class="countdown-date"><button class="countdown-edit" onclick="promptExamDate()">変更</button><button class="countdown-edit" onclick="clearExamDate()" style="margin-left:4px;">削除</button></div>
    `;
  } else {
    el.className = 'exam-countdown show past';
    el.innerHTML = `
      <div class="countdown-label">${formatted}（${Math.abs(diffDays)} 日前）</div>
      <div class="countdown-days">試験お疲れさまでした！</div>
      <div class="countdown-date"><button class="countdown-edit" onclick="promptExamDate()">次の試験日を設定</button><button class="countdown-edit" onclick="clearExamDate()" style="margin-left:4px;">削除</button></div>
    `;
  }

  setArea.style.display = 'none';
}

function clearExamDate() {
  if (!confirm('試験日の設定を削除しますか？')) return;
  localStorage.removeItem('gkentei_exam_date');
  document.getElementById('examCountdown').classList.remove('show');
  document.getElementById('examCountdown').className = 'exam-countdown';
  document.getElementById('setExamArea').style.display = 'block';
}

function quitQuiz() {
  if (!confirm('学習を中断してトップに戻りますか？\n（ここまでの回答履歴は保存されます）')) return;
  resetQuiz();
}

function resetQuiz() {
  document.getElementById('startScreen').style.display = 'block';
  document.getElementById('quizScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'none';
  updateCategoryChips();
  updateSeenStats();
}

function clearSeenHistory() {
  if (!confirm('回答履歴をリセットしますか？\n全ての問題が「未回答」に戻ります。')) return;
  state.seenQuestions = {};
  state.history = {};
  localStorage.removeItem('gkentei_seen');
  localStorage.removeItem('gkentei_history');
  updateCategoryChips();
  updateSeenStats();
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('quizScreen').style.display || document.getElementById('quizScreen').style.display === 'none') return;

  if (!state.answered) {
    if (e.key === '1' || e.key === 'a') selectAnswer(0);
    else if (e.key === '2' || e.key === 'b') selectAnswer(1);
    else if (e.key === '3' || e.key === 'c') selectAnswer(2);
    else if (e.key === '4' || e.key === 'd') selectAnswer(3);
    else if (e.key === 'p' || e.key === 'P') passQuestion();
  } else {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'n') {
      e.preventDefault();
      nextQuestion();
    }
  }
});

init();
</script>
</body>
</html>
